name: Build ProTrader Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'scripts/**'
      - 'android-icons/**'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/build-protrader-android.yml'

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Fix Android Browser dependency
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("node_modules/@capgo/capacitor-social-login/android/build.gradle")
          code = path.read_text()

          pattern = r"implementation\s+['\"]com\.google\.androidbrowserhelper:androidbrowserhelper:([^'\"]+)['\"]"
          replacement = r"implementation('com.google.androidbrowserhelper:androidbrowserhelper:\1') { exclude group: 'androidx.browser', module: 'browser' }"

          code, count = re.subn(pattern, replacement, code)
          if count != 1:
              raise SystemExit("Browser dependency patch failed")

          code = code.replace(
              "    testImplementation ",
              "    implementation 'androidx.browser:browser:1.8.0'\n    testImplementation ",
              1
          )
          path.write_text(code)
          PY

      - name: Build web files and create Android project
        run: |
          npm run build
          npx cap add android
          npx cap sync android

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install required SDK platform
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Apply ProTrader icon
        run: python3 scripts/apply-android-icons.py

      - name: Build installable debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew --no-daemon assembleDebug

      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProTrader-Android-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

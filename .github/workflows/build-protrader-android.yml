name: Build ProTrader Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'scripts/**'
      - 'android-icons/**'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/build-protrader-android.yml'

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Build web files and create Android project
        run: |
          npm run build
          npx cap add android
          npx cap sync android

      - name: Install required SDK platform
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --licenses < /dev/null >/dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Apply ProTrader icon
        run: python3 scripts/apply-android-icons.py

      - name: Build installable debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew --no-daemon assembleDebug

      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProTrader-Android-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
